name: Multi-language architecture recovery tests

on:
  push:
    branches: [main]
    paths:
      - "architecture_model/recovery.py"
      - "architecture_model/model.py"
      - "src/parser.py"
      - "tests/test_multilanguage_recovery.py"
      - ".github/workflows/multilanguage-recovery.yml"
  pull_request:
    paths:
      - "architecture_model/recovery.py"
      - "architecture_model/model.py"
      - "src/parser.py"
      - "tests/test_multilanguage_recovery.py"
  workflow_dispatch:

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest tree-sitter-language-pack
      - name: Compile changed Python modules
        run: python -m compileall -q architecture_model/recovery.py src/parser.py features/runtime_architecture.py
      - name: Run multi-language architecture recovery tests
        run: python -m pytest -q tests/test_multilanguage_recovery.py
