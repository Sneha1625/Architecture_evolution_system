name: Multi-language architecture recovery tests

on:
  push:
    branches: [main]
    paths:
      - "architecture_model/recovery.py"
      - "architecture_model/model.py"
      - "src/parser.py"
      - "architecture_model/runtime_version_runner.py"
      - "architecture_model/node_runtime_adapter.py"
      - "tests/test_node_runtime_adapter.py"
      - "features/runtime_architecture.py"
      - "tests/test_multilanguage_recovery.py"
      - "tests/test_runtime_version_runner.py"
      - ".github/workflows/multilanguage-recovery.yml"
  pull_request:
    paths:
      - "architecture_model/recovery.py"
      - "architecture_model/model.py"
      - "src/parser.py"
      - "architecture_model/runtime_version_runner.py"
      - "tests/test_multilanguage_recovery.py"
      - "tests/test_runtime_version_runner.py"
  workflow_dispatch:

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: python -m pip install --upgrade pytest tree-sitter-language-pack
      - name: Compile changed Python modules
        run: python -m compileall -q architecture_model/recovery.py architecture_model/runtime_version_runner.py architecture_model/node_runtime_adapter.py src/parser.py features/runtime_architecture.py
      - name: Run multi-language architecture recovery tests
        run: python -m pytest -q tests/test_multilanguage_recovery.py tests/test_runtime_version_runner.py tests/test_node_runtime_adapter.py
