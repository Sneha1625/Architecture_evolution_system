name: Runtime comparison checks

on:
  push:
    branches:
      - fix/runtime-comparison-evidence
  pull_request:
    branches:
      - main

jobs:
  runtime-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile project Python files
        run: python -m compileall -q architecture_model features repository src app_combined.py app2.py
      - name: Test runtime comparison logic
        run: python -m pytest -q tests/test_runtime_source_diff.py tests/test_runtime_evolution.py tests/test_runtime_comparator.py
